<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-STAR Project & Activity Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <header class="bg-[#ef4444] text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black italic tracking-wider bg-white text-red-600 px-2 py-0.5 rounded">V STAR</span>
      </div>
      <div class="flex items-center space-x-2 text-sm flex-wrap gap-y-2">
        <button onclick="switchTab('activities')" class="px-3 py-1.5 rounded hover:bg-red-600 font-medium">กิจกรรม</button>
        <button onclick="switchTab('register')" class="px-3 py-1.5 rounded hover:bg-red-600 font-medium">กรอกข้อมูล</button>
        <button onclick="switchTab('add-activity')" class="px-3 py-1.5 bg-yellow-500 text-yellow-900 rounded hover:bg-yellow-400 font-bold">+ สร้างกิจกรรม</button>
        <button onclick="switchTab('admin')" class="px-3 py-1.5 bg-red-800 rounded hover:bg-red-900 font-medium">หลังบ้าน</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full flex-grow p-4">
    <!-- หน้า 1: แสดงกิจกรรม -->
    <section id="sec-activities" class="space-y-6">
      <div class="flex justify-between items-center border-b pb-3">
        <h1 class="text-xl font-bold text-gray-800">☑ กิจกรรมทั้งหมด</h1>
      </div>
      <div id="activity-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS จะโหลดข้อมูลกิจกรรมมาใส่ที่นี่ -->
      </div>
    </section>

    <!-- หน้า 2: อัปโหลด/สร้างกิจกรรมใหม่ -->
    <section id="sec-add-activity" class="hidden space-y-4">
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-lg font-bold text-gray-700 border-b pb-3 mb-4 flex items-center gap-2">📢 สร้างกิจกรรมใหม่</h2>
        <form id="activityForm" onsubmit="handleAddActivity(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium">ชื่อกิจกรรมหลัก *</label>
            <input type="text" id="act-title" required class="w-full border rounded-lg p-2.5">
          </div>
          <div>
            <label class="block text-sm font-medium">ชื่อย่อ / คำอธิบายรอง</label>
            <input type="text" id="act-subtitle" class="w-full border rounded-lg p-2.5">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium">วันที่จัดกิจกรรม</label>
              <input type="text" id="act-date" placeholder="เช่น 12 - 16 ต.ค. 69" class="w-full border rounded-lg p-2.5">
            </div>
            <div>
              <label class="block text-sm font-medium">สถานที่</label>
              <input type="text" id="act-location" class="w-full border rounded-lg p-2.5">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium">ข้อมูลผู้เข้าร่วม (จำนวน/เพศ)</label>
            <input type="text" id="act-participants" placeholder="เช่น ชาย 69 หญิง 108 รวม 177" class="w-full border rounded-lg p-2.5">
          </div>
          <div>
            <label class="block text-sm font-medium">URL รูปภาพหน้าปก</label>
            <input type="url" id="act-image" placeholder="https://..." class="w-full border rounded-lg p-2.5">
          </div>
          <button type="submit" class="w-full bg-yellow-500 text-yellow-900 font-bold py-3 rounded-lg hover:bg-yellow-400">
            ประกาศกิจกรรม
          </button>
        </form>
      </div>
    </section>

    <!-- หน้า 3: ฟอร์มสมัคร (ซ่อนไว้ให้เหมือนเดิม) -->
    <section id="sec-register" class="hidden space-y-4">
        <!-- ใส่โค้ด HTML ฟอร์มกรอกข้อมูลส่วนตัวจากไฟล์เดิมของคุณลงตรงนี้ -->
        <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500">
            (โค้ดฟอร์มสมัครกิจกรรมคงเดิมจากเวอร์ชันที่แล้ว)
        </div>
    </section>

    <!-- หน้า 4: หลังบ้าน Admin -->
    <section id="sec-admin" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">ระบบหลังบ้าน (Admin)</h2>
        <div class="bg-red-100 text-red-700 font-bold px-4 py-2 rounded-lg text-sm">
          ผู้สมัคร: <span id="applicant-count">0</span>
        </div>
      </div>
      <div id="applicant-list" class="space-y-3"></div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = () => {
      loadActivities();
    };

    function switchTab(tabName) {
      ['sec-activities', 'sec-add-activity', 'sec-register', 'sec-admin'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById('sec-' + tabName).classList.remove('hidden');

      if (tabName === 'activities') loadActivities();
      if (tabName === 'admin') loadApplicants(); // ฟังก์ชันนี้ใช้โค้ดเดิมในเวอร์ชันที่แล้ว
    }

    // โหลดกิจกรรมจาก Database มาแสดงหน้าแรก
    async function loadActivities() {
      const { data, error } = await supabaseClient.from('activities').select('*').order('created_at', { ascending: false });
      if (error) return console.error(error);

      const container = document.getElementById('activity-list');
      container.innerHTML = '';
      
      data.forEach(act => {
        const imgUrl = act.image_url || 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=800&q=80';
        container.innerHTML += `
          <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <img src="${imgUrl}" class="w-full h-48 object-cover">
            <div class="p-4 space-y-2">
              <h2 class="text-lg font-bold text-blue-600">${act.title}</h2>
              <p class="text-xs font-semibold text-blue-500">${act.subtitle || ''}</p>
              <div class="text-xs text-gray-600 space-y-1">
                <p>📅 ${act.event_date || '-'}</p>
                <p>📍 ${act.location || '-'}</p>
                <p>👥 ${act.participants_info || '-'}</p>
              </div>
              <div class="pt-2 border-t">
                <button onclick="switchTab('register')" class="w-full bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-600">
                  สมัครกิจกรรม
                </button>
              </div>
            </div>
          </div>
        `;
      });
    }

    // บันทึกกิจกรรมใหม่ลง Database
    async function handleAddActivity(e) {
      e.preventDefault();
      const newAct = {
        title: document.getElementById('act-title').value,
        subtitle: document.getElementById('act-subtitle').value,
        event_date: document.getElementById('act-date').value,
        location: document.getElementById('act-location').value,
        participants_info: document.getElementById('act-participants').value,
        image_url: document.getElementById('act-image').value
      };

      const { error } = await supabaseClient.from('activities').insert([newAct]);
      if (error) alert("Error: " + error.message);
      else {
        alert("สร้างกิจกรรมสำเร็จ!");
        document.getElementById('activityForm').reset();
        switchTab('activities');
      }
    }
  </script>
</body>
</html>
